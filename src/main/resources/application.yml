spring:
  application:
    name: urbtrack
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.flywaydb.core: WARN
    org.hibernate.orm.connections.pooling: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  dispatch:
    offers-per-round: 3
    offer-ttl-seconds: 30
    radius-km-rounds: [5, 10, 20]
    location-max-age-seconds: 120
    expiration-scan-ms: 5000
  location:
    max-future-seconds: 60
  websocket:
    allowed-origin-patterns: "*"
  routing:
    osrm-base-url: https://router.project-osrm.org
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
